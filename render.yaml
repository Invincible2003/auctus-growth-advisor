# Render Blueprint YAML for AUCTUS Deployment
# Brand Owner: Made by Aryan Pandey

services:
  # Python FastAPI Backend
  - type: web
    name: auctus-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: auctus-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render dashboard

databases:
  # Supabase compatible PostgreSQL database
  - name: auctus-db
    plan: free
